<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля — OS_GO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #333; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }
        
        .step {
            margin-bottom: 20px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
        }
        .step.active {
            border-color: #667eea;
            background: #eef2ff;
        }
        .step.done {
            border-color: #10b981;
            background: #ecfdf5;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            margin-top: 10px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #667eea; }
        input:disabled { background: #f3f4f6; cursor: not-allowed; }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { 
            background: #9ca3af; 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
        
        .error { color: #ef4444; font-size: 14px; margin-top: 8px; }
        .success { color: #10b981; font-size: 14px; margin-top: 8px; }
        .hidden { display: none; }
        
        .token-display {
            font-family: monospace;
            font-size: 12px;
            color: #6b7280;
            word-break: break-all;
            margin-top: 8px;
            padding: 8px;
            background: #f3f4f6;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Сброс пароля</h1>
        <p>Создайте новый пароль для вашего аккаунта.</p>
        
        <!-- Шаг 1: Проверка токена -->
        <div class="step active" id="step1">
            <strong>Шаг 1</strong> — Проверка ссылки
            <div class="token-display" id="tokenDisplay">Токен: загрузка...</div>
            <button id="btnVerify" onclick="verifyToken()">✅ Подтвердить ссылку</button>
            <div id="verifyMsg"></div>
        </div>
        
        <!-- Шаг 2: Новый пароль (изначально скрыт) -->
        <div class="step hidden" id="step2">
            <strong>Шаг 2</strong> — Новый пароль
            <input type="password" id="password" placeholder="Новый пароль (мин. 12 символов)" disabled>
            <input type="password" id="confirm" placeholder="Подтвердите пароль" disabled>
            <button id="btnSubmit" onclick="submitPassword()" disabled>Сменить пароль</button>
            <div id="submitMsg"></div>
        </div>
        
        <!-- Успех -->
        <div class="hidden" id="success">
            <div class="step done">
                <strong>✅ Готово!</strong>
                <p style="margin-top: 8px;">Пароль успешно изменён. Теперь вы можете войти в приложение.</p>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const btnVerify = document.getElementById('btnVerify');
        const verifyMsg = document.getElementById('verifyMsg');
        
        if (!token) {
            tokenDisplay.textContent = '❌ Токен не найден в ссылке';
            btnVerify.disabled = true;
        } else {
            tokenDisplay.textContent = `Токен: ${token.substring(0, 20)}...`;
        }

        async function verifyToken() {
            btnVerify.disabled = true;
            verifyMsg.innerHTML = '<span style="color: #667eea;">⏳ Проверка...</span>';
            
            try {
                const response = await fetch(`/auth/reset-password?token=${token}`);
                const data = await response.json();
                
                if (response.ok && data.valid) {
                    step1.classList.remove('active');
                    step1.classList.add('done');
                    verifyMsg.innerHTML = '<span class="success">✅ Ссылка подтверждена!</span>';
                    
                    // Показываем шаг 2
                    step2.classList.remove('hidden');
                    step2.classList.add('active');
                    document.getElementById('password').disabled = false;
                    document.getElementById('confirm').disabled = false;
                    document.getElementById('btnSubmit').disabled = false;
                    document.getElementById('password').focus();
                } else {
                    verifyMsg.innerHTML = `<span class="error">❌ ${data.detail || 'Ссылка недействительна'}</span>`;
                    btnVerify.disabled = false;
                }
            } catch (e) {
                verifyMsg.innerHTML = '<span class="error">❌ Ошибка соединения</span>';
                btnVerify.disabled = false;
            }
        }

        async function submitPassword() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const submitMsg = document.getElementById('submitMsg');
            const btnSubmit = document.getElementById('btnSubmit');
            
            if (password.length < 12) {
                submitMsg.innerHTML = '<span class="error">Минимум 12 символов</span>';
                return;
            }
            if (password !== confirm) {
                submitMsg.innerHTML = '<span class="error">Пароли не совпадают</span>';
                return;
            }
            
            btnSubmit.disabled = true;
            submitMsg.innerHTML = '<span style="color: #667eea;">⏳ Сохранение...</span>';
            
            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    step2.classList.remove('active');
                    step2.classList.add('done');
                    document.getElementById('success').classList.remove('hidden');
                    step2.querySelector('input').disabled = true;
                    step2.querySelectorAll('input')[1].disabled = true;
                } else {
                    submitMsg.innerHTML = `<span class="error">❌ ${data.detail || 'Ошибка'}</span>`;
                    btnSubmit.disabled = false;
                }
            } catch (e) {
                submitMsg.innerHTML = '<span class="error">❌ Ошибка соединения</span>';
                btnSubmit.disabled = false;
            }
        }
        
        // Enter в поле пароля = отправка
        document.getElementById('confirm').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitPassword();
        });
    </script>
</body>
</html>
